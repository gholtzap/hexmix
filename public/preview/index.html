<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blank page</title>
  <style>
    :root {
      --p-text: #0c0a09;
      --p-background: #ffffff;
      --p-primary: #e98878;
      --p-secondary: #ffe291;
      --p-accent: #a8655f;
      --p-heading-font: system-ui, sans-serif;
      --p-body-font: system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--p-background); }
    body { margin: 0; min-height: 100vh; background: var(--p-background); color: var(--p-text); font-family: var(--p-body-font); }
    main { max-width: 720px; margin: 0 auto; padding: 22vh 28px 240px; }
    h1 { margin: 0; font-family: var(--p-heading-font); font-size: 48px; font-weight: 600; letter-spacing: -0.04em; line-height: 1.1; }
    p { margin: 18px 0 0; font-size: 16px; line-height: 1.5; }
    .colors { display: flex; gap: 12px; margin-top: 40px; }
    .colors span { display: block; width: 72px; height: 72px; border-radius: 12px; }
    .colors span:nth-child(1) { background: var(--p-primary); }
    .colors span:nth-child(2) { background: var(--p-secondary); }
    .colors span:nth-child(3) { background: var(--p-accent); }
    @media (max-width: 600px) {
      main { padding: 19vh 24px 260px; }
      h1 { font-size: 32px; }
      .colors span { width: 56px; height: 56px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Blank page</h1>
    <p>A clean place to start.</p>
    <div class="colors" aria-hidden="true"><span></span><span></span><span></span></div>
  </main>
</body>
</html>
