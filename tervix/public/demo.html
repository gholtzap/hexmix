<!doctype html><html lang="en" data-static-source-page="true"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team planning | Tervix</title><link rel="stylesheet" href="/demo.css"><script src="http://127.0.0.1:3000/color-bridge.js" defer></script><script src="/demo.js" defer></script></head><body>
<div class="demo-shell"><header class="demo-header"><div class="demo-heading"><h1 id="demo-title">Team planning</h1><p id="demo-description">See each step in one shared view.</p><div class="demo-meta"><span>Review interval:</span><button id="interval" aria-label="Change review interval">Every day <span aria-hidden="true">⌄</span></button><span class="demo-price">One shared plan</span></div></div><div class="demo-actions"><button id="test-action">Test</button><button id="share-action">Share</button><button id="save-action">Save</button><span>Auto</span><button id="display-action" aria-label="Change display">▣</button></div></header>
<div class="demo-main"><aside class="demo-sidebar"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search signals and actions" aria-label="Search signals and actions"></label><nav id="demo-categories" aria-label="Available areas"></nav><button class="custom-action" id="custom-action">Create a custom step</button></aside>
<main class="demo-canvas"><div class="workflow-tabs"><span>Shared plans:</span><div id="workflow-tabs"></div></div><div class="flow-viewport" aria-label="Plan diagram"><div class="flow-inner"><div class="flow-lines" aria-hidden="true"></div><div id="flow-nodes"></div></div></div><section class="agent-card" aria-label="Plan assistant"><div class="agent-card-heading"><span class="agent-icon">✧</span><h2>Plan assistant</h2><button id="close-agent" aria-label="Close assistant">×</button></div><div class="agent-body"><p>Describe the next step in plain words. Build a plan your team can review.</p><textarea id="agent-prompt" aria-label="Describe a plan" placeholder="Describe a plan for your team"></textarea><div class="agent-footer"><span>⌘ + Enter to generate</span><button id="generate-action">Generate</button></div><p class="agent-status" role="status" aria-live="polite"></p></div></section><button class="open-agent" id="open-agent" hidden>Open plan assistant</button></main></div></div>
<dialog id="demo-dialog"><h2 id="dialog-title">Review this plan</h2><p id="dialog-copy">This is a local preview of a shared plan.</p><div class="dialog-actions"><button id="dialog-close">Close</button></div></dialog>
</body></html>
