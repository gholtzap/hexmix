<!doctype html><html lang="en" data-static-source-page="true"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account | Tervix</title><link rel="stylesheet" href="/auth.css"><script src="http://127.0.0.1:3000/color-bridge.js" defer></script><script src="/auth.js" defer></script></head><body><div class="auth-mark" aria-hidden="true"></div><button class="display" id="display" aria-label="Change display">▣</button><main><h1 id="page-heading"></h1><p id="page-intro"></p><section class="auth-card"><h2 id="card-heading"></h2><p id="card-intro"></p><div class="auth-options"><button type="button" class="option">Work account</button><button type="button" class="option">Passkey</button></div><div class="divider"><span>Or continue with</span></div><form id="account-form" data-local-demo><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="hello@tervix.example" required><div class="password-label"><label for="password">Password</label><a id="forgot" href="#">Forgot password?</a></div><input id="password" type="password" autocomplete="off" minlength="8" required><div id="confirm-wrap" hidden><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="off"></div><button class="submit" type="submit" id="submit-label"></button><p role="status" aria-live="polite" id="form-status"></p></form><div class="divider end"><span id="switch-prompt"></span></div><a id="switch-link" href="#"></a></section></main></body></html>
